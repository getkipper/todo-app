<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root {
    --bg: #070d19;
    --card: #0f172a;
    --border: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --blue: #0ea5e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
  }
  main { width: min(30rem, 90vw); }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  #text, form button {
    font: inherit;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
  }
  #text { flex: 1; background: var(--card); color: var(--text); }
  #text:focus { outline: 2px solid var(--blue); }
  form button {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
  }
  ul { display: grid; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
  }
  li span { flex: 1; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li button {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  #empty { color: var(--muted); }
  #status {
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem 0.9rem;
    margin: 0 0 1rem;
  }
</style>
</head>
<body>

<main>
  <h1>Todo</h1>

  <p id="status" hidden></p>

  <form id="add">
    <input id="text" placeholder="What needs doing?" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>
  <p id="empty">Nothing yet.</p>
</main>

<script>
  // The list lives in Postgres, behind the small API in server.js.
  let todos = []

  const list = document.getElementById('list')
  const empty = document.getElementById('empty')
  const status = document.getElementById('status')
  const text = document.getElementById('text')

  async function api(path, options) {
    const res = await fetch(path, options)
    if (res.status === 204) return null
    const body = await res.json()
    if (!res.ok) throw new Error(body.error)
    return body
  }

  // Runs one API action, showing its error in the banner if it fails.
  async function attempt(action) {
    try {
      await action()
      status.hidden = true
    } catch (err) {
      status.textContent = err.message
      status.hidden = false
    }
    render()
  }

  document.getElementById('add').addEventListener('submit', event => {
    event.preventDefault()
    attempt(async () => {
      todos.push(await api('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: text.value.trim() }),
      }))
      text.value = ''
    })
  })

  function toggle(id) {
    attempt(async () => {
      const todo = todos.find(todo => todo.id === id)
      const updated = await api(`/api/todos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !todo.done }),
      })
      todo.done = updated.done
    })
  }

  function remove(id) {
    attempt(async () => {
      await api(`/api/todos/${id}`, { method: 'DELETE' })
      todos = todos.filter(todo => todo.id !== id)
    })
  }

  function render() {
    empty.hidden = todos.length > 0 || !status.hidden

    list.replaceChildren(...todos.map(todo => {
      const item = document.createElement('li')
      item.className = todo.done ? 'done' : ''

      const tick = document.createElement('input')
      tick.type = 'checkbox'
      tick.checked = todo.done
      tick.addEventListener('change', () => toggle(todo.id))

      const title = document.createElement('span')
      title.textContent = todo.title

      const del = document.createElement('button')
      del.type = 'button'
      del.textContent = 'Remove'
      del.addEventListener('click', () => remove(todo.id))

      item.append(tick, title, del)
      return item
    }))
  }

  attempt(async () => { todos = await api('/api/todos') })
</script>

</body>
</html>
